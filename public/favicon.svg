<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Timeo favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="tFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="48" y="48" width="416" height="416" rx="92" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- T -->
  <path
    d="M160 170
       C160 158 169 148 181 148
       H331
       C343 148 352 158 352 170
       V196
       C352 208 343 218 331 218
       H279
       V356
       C279 368 269 378 257 378
       H255
       C243 378 233 368 233 356
       V218
       H181
       C169 218 160 208 160 196
       Z"
    fill="url(#tFill)"/>

  <!-- subtle inner stroke for crispness -->
  <rect x="48" y="48" width="416" height="416" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8"/>
</svg>
